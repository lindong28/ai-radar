[project]
name = "ai-radar"
version = "0.1.0"
description = "AI Radar — public AI information stream (aiplanet.live)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.12",
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "jinja2>=3.1.0",
    "trafilatura>=1.12.0",
    "json-repair>=0.30.0",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "playwright>=1.40.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
lint.select = [
    "E",    # pycodestyle error
    "W",    # pycodestyle warning
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
lint.ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
strict_optional = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]
