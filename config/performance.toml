schema_version = 1

[project]
id = "ai-radar"
owner = "ai-radar"

[protocol]
required_major = 1

[scheduler]
quick_cadence_seconds = 300
browser_cadence_seconds = 3600
window_seconds = 86400
quick_minimum_samples = 12
browser_minimum_samples = 6
round_deadline_seconds = 240
project_concurrency = 2
browser_concurrency = 1

[adapter]
executable = "performance-adapter"
capability = "observation.v1"
executable_sha256 = "9bcb9395c5830d023c0ecf32d18f1488fd58c7a3071cc9171cfaa1657fe17874"

[remediation]
enabled = false

[engineering_evaluation]
percentile_estimator = "nearest-rank"
warm_samples = 20

[[engineering_metrics]]
id = "homepage_ssr"
unit = "ms"
display_unit = "ms"
median_budget_ms = 500
p95_budget_ms = 1000

[[engineering_metrics]]
id = "curated_api"
unit = "ms"
display_unit = "ms"
median_budget_ms = 500
p95_budget_ms = 1000

[[engineering_metrics]]
id = "wechat_api"
unit = "ms"
display_unit = "ms"
median_budget_ms = 300

[[engineering_metrics]]
id = "wechat_ssr"
unit = "ms"
display_unit = "ms"
median_budget_ms = 300

# Browser journeys use isolated contexts. Remote providers remain schema-only.
[[journeys]]
id = "homepage.first_card"
target = "homepage"
probe = "browser"
hard_timeout_seconds = 20
[[journeys.vantages]]
id = "same_host_origin"
provider = "synthetic"
enabled = true
provisional = true
allowed_load_classes = ["idle", "busy", "unknown"]
[[journeys.vantages.metrics]]
