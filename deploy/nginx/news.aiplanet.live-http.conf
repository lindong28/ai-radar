# AI Radar public site -- port 80 half.
#
# Split from the TLS half on purpose: this file has no certificate paths and no
# upstream include, so it can be enabled on a fresh host BEFORE any certificate
# exists. That is what makes the two-phase bootstrap possible at all:
#
#   1. enable this file            -> nginx -t passes with nothing else present
#   2. certbot certonly --nginx    -> challenge served from the location below
#   3. enable the TLS half         -> its certificate paths now exist
#
# The previous single-file layout referenced the certificate it was trying to
# obtain, so `nginx -t` failed before certbot could ever run.

server {
    listen 80;
    listen [::]:80;
    server_name news.aiplanet.live;

    # Must stay above the redirect: Let's Encrypt fetches this over plain HTTP
    # and does not follow the 301 to a certificate that may not exist yet.
    # Renewal repeats unattended every ~60 days; a break here surfaces as an
    # expired certificate long after anyone connects it to this file.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Anything on port 80 that is not this hostname: drop the connection. Without
# this, bare-IP HTTP requests fall through to whatever other default server the
# host ships, and the origin address stays discoverable by scanners.
#
# NOTE: exactly one default_server may exist per port. The distro's
# sites-enabled/default and the legacy ai-radar site both claim port 80's;
# disable them when enabling this file, or nginx refuses to start.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
