# AI Radar public site -- TLS half.
#
# Enable only after certbot has issued the certificate (the -http half handles
# that bootstrap); the ssl_certificate paths below must exist for nginx -t to
# pass. The active-upstream include is created by install-server.sh, so it
# exists before this file can be enabled.
#
# `listen ... http2` is the pre-1.25 syntax, kept deliberately: the pinned
# host runs nginx 1.24, where the `http2 on;` directive does not exist yet.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name news.aiplanet.live;

    ssl_certificate     /etc/letsencrypt/live/news.aiplanet.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.aiplanet.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Response hygiene. server_tokens hides "nginx/1.24.0 (Ubuntu)" from the
    # Server header and error pages. The headers below are the app's only
    # browser-side defence layer (the app itself sets none, on purpose: this
    # file is the single place they live, so they cannot be emitted twice).
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Two Report-Only policies, on purpose (browsers evaluate both; neither
    # blocks anything). The first is the legacy loose policy kept as a known-
    # quiet baseline. The second is the policy we intend to ENFORCE: the pages
    # no longer carry inline <script> blocks or onload/onerror attributes
    # (bootstrap moved to `<script type="module" src="/app.js?v=...">` +
    # `<body data-init>`, image fallbacks to a delegated listener in app.js),
    # except the byte-identical theme FOUC guard in every <head>, which the
    # sha256 below allows. No nonces: the public pages are cached at the edge
    # for 90 s, so a per-response nonce would be replayed to other visitors.
    #
    # To enforce after a quiet week of reports: rename the second header from
    # Content-Security-Policy-Report-Only to Content-Security-Policy and drop
    # the first one. Nothing else changes. If the FOUC <script> in the <head>
    # templates is ever edited, recompute the hash (base64 of sha256 over the
    # exact bytes between <script> and </script>) or the theme guard will be
    # blocked on every page:
    #   python3 -c 'import hashlib,base64,re,sys;t=open("web/static/index.html").read();
    #     b=re.search(r"<script>(.*?)</script>",t,re.S).group(1).encode();
    #     print(base64.b64encode(hashlib.sha256(b).digest()).decode())'
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'none'; script-src 'self' 'sha256-QVPlFJ18gdqh301rTqrVbK1JF/pm315xJ39vQItmVVA='; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'none'; worker-src 'none'; upgrade-insecure-requests" always;

    # The `ai_radar_active` upstream that proxy_pass targets is defined in
    # /etc/nginx/conf.d/ai-radar-active-upstream.conf, which nginx already
    # auto-includes at http scope via `include /etc/nginx/conf.d/*.conf`.
    # It must NOT be re-included here: an `upstream {}` block is illegal in
    # server context ("upstream directive is not allowed here"). The blue/green
    # switch still works through that one file -- apply-db-update.sh rewrites it
    # and reloads, and every server proxying to ai_radar_active picks up the
    # new port.

    # Interactive API docs are off in the app (docs_url=None); refusing them
    # here as well keeps an older slot from re-exposing the route map.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://ai_radar_active;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nothing upstream of this origin issues Cloudflare Access assertions,
        # so any such header is client-supplied. Strip it: an older app slot
        # treated its mere presence as authentication.
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/healthz {
        proxy_pass http://ai_radar_active/api/v1/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}

# Anything on port 443 that is not this hostname: drop the connection.
# Keeps the origin from answering on its bare IP once DNS-only mode exposes
# the address. Verifying this needs a paired probe: an unresolvable-name
# request also fails TLS, so a failure alone does not prove the rejection
# caused it.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/news.aiplanet.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.aiplanet.live/privkey.pem;

    return 444;
}
