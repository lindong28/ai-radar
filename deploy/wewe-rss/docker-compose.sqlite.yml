services:
  app:
    image: cooderl/wewe-rss-sqlite:latest
    container_name: ai-radar-wewe-rss
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_TYPE=sqlite
      - AUTH_CODE=${WEWE_AUTH_CODE}
      - CRON_EXPRESSION=${WEWE_CRON_EXPRESSION}
      - SERVER_ORIGIN_URL=${WEWE_SERVER_ORIGIN_URL}
      - HTTP_PROXY=${WEWE_HTTP_PROXY}
      - HTTPS_PROXY=${WEWE_HTTPS_PROXY}
      - NO_PROXY=${WEWE_NO_PROXY}
      # Keep FEED_MODE unset: ai-radar does WeChat full-text scraping itself.
      # - FEED_MODE=fulltext
    volumes:
      - ./data:/app/data
