<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Radar · 全部 AI 动态</title>
    <meta name="theme-color" content="#10151c">
    <script>(function(){var r=document.documentElement,m=document.querySelector('meta[name="theme-color"]');var s=null;try{s=localStorage.getItem("ai-radar:theme");}catch(e){}var t=(s==="dark"||s==="light"||s==="system")?s:"system";var d=t==="dark"||(t==="system"&&(typeof matchMedia!=="function"||matchMedia("(prefers-color-scheme: dark)").matches));r.dataset.theme=d?"dark":"light";r.dataset.themeMode=t;if(m)m.setAttribute("content",d?"#10151c":"#f4f5f6");})();</script>
    <link rel="modulepreload" href="/app.js?v=20260817-aihot-fc370193">
    <link rel="stylesheet" href="/style.css?v=20260817-aihot-03fc77b5">
  </head>
  <body>
    <aside id="app-sidebar" class="sidebar" aria-label="主导航">
      <button type="button" class="sidebar-close" aria-label="关闭导航">×</button>
      <a class="sidebar-brand" aria-label="AI Radar" href="/"><span class="brand-logo brand-logo-sidebar" aria-label="AI RADAR"><span class="brand-logo-ai">AI</span><span class="brand-logo-orbit" aria-hidden="true"><span class="brand-logo-orbit-core"></span></span><span class="brand-logo-hot">RADAR</span></span></a>
      <div class="divider"></div>
      <div class="side-group-label">内容</div>
      <nav class="side-nav">
        <a class="side-link" href="/"><span class="side-icon side-icon-curated" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></span><span>精选</span></a>
        <a class="side-link side-link-active" href="/all"><span class="side-icon side-icon-all" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg></span><span>全部 AI 动态</span></a>
        <a class="side-link" href="/hot"><span class="side-icon side-icon-all" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6v6l4 2"/><path d="M21 12a9 9 0 1 1-9-9"/></svg></span><span>热点榜</span></a>
        <a class="side-link" href="/wechat"><span class="side-icon side-icon-wechat" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/></svg></span><span>微信文章解读</span></a>
        <a class="side-link" href="/daily"><span class="side-icon side-icon-daily" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg></span><span>AI 日报</span></a>
        <a class="side-link" href="/bookmarks"><span class="side-icon side-icon-bookmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg></span><span>收藏</span></a>
      </nav>
      <div class="side-group-label">更多</div>
      <nav class="side-nav">
        <a class="side-link" href="/about"><span class="side-icon side-icon-about" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16v-4M12 8h.01"/><path d="M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9Z"/></svg></span><span>关于</span></a>
        <a class="side-link" href="/changelog"><span class="side-icon side-icon-all" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg></span><span>更新日志</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="theme-toggle" role="group" aria-label="主题切换">
          <span class="theme-toggle-thumb" aria-hidden="true"></span>
          <button type="button" class="theme-btn" data-theme-pref="dark" aria-pressed="false" title="深色主题" aria-label="深色主题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4a8 8 0 1 0 9.5 9.5z"/></svg></button>
          <button type="button" class="theme-btn" data-theme-pref="system" aria-pressed="false" title="跟随系统" aria-label="跟随系统"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M9 20.5h6M12 17v3.5"/></svg></button>
          <button type="button" class="theme-btn" data-theme-pref="light" aria-pressed="false" title="浅色主题" aria-label="浅色主题"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.8 1.8M17.2 17.2 19 19M19 5l-1.8 1.8M6.8 17.2 5 19"/></svg></button>
        </div>
{% include "_icp_footer.html" %}
      </div>
    </aside>
    {% set mobile_active = "all" %}
    <main class="app-main all-page">
      <section class="page-header">
        <div>
          <h1>全部 AI 动态</h1>
          <p class="page-subtitle">按时间倒序的全量信息流</p>
        </div>
        <div class="feed-toolbar-row">
          <div class="feed-segments">
            <div class="seg-list" data-category-filter aria-label="内容分类">
              <a class="seg-item seg-item-active" href="/all?page=1" data-category="all" aria-pressed="true">全部</a>
              <a class="seg-item" href="/all?category=ai-models&page=1" data-category="model" aria-pressed="false">模型</a>
              <a class="seg-item" href="/all?category=ai-products&page=1" data-category="product" aria-pressed="false">产品</a>
              <a class="seg-item" href="/all?category=industry&page=1" data-category="industry" aria-pressed="false">行业</a>
              <a class="seg-item" href="/all?category=paper&page=1" data-category="paper" aria-pressed="false">论文</a>
              <a class="seg-item" href="/all?category=tip&page=1" data-category="practice" aria-pressed="false">技巧</a>
            </div>
          </div>
          <form class="feed-filter" action="/all" method="get">
            <input id="category-param" type="hidden" name="category" value="">
            <label class="source-filter" for="channel-param">来源
              <span class="feed-channel-select-wrap">
                <select id="channel-param" name="channel" class="feed-channel-select" data-channel-filter aria-label="信息来源">
                  <option value="">全部</option>
                  <option value="firstParty">一手信源</option>
                  <option value="news">资讯</option>
                  <option value="x">推文</option>
                </select>
                <svg class="feed-channel-select-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </label>
            <input id="search" type="search" name="q" placeholder="搜索标题/摘要…">
            <button class="filter-submit" type="submit">搜索</button>
          </form>
        </div>
      </section>
      <section id="list" class="timeline" aria-live="polite">
{% include "_prepaint_list.html" %}
      </section>
      <div class="mobile-icp">
{% include "_icp_footer.html" %}
      </div>
    </main>
    <script id="__PRELOAD__" type="application/json">
      {{ preload | tojson | safe }}
    </script>
{% include "_mobile_tabbar.html" %}
    <script type="module" async>
      import { initClientNavigation, initTimeline } from "/app.js?v=20260817-aihot-fc370193";
      initClientNavigation();
      initTimeline();
    </script>
  </body>
</html>
